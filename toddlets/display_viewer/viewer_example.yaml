# =============================================================================
# DISPLAY VIEWER - minimal complete example (480x480 panel; reflow the
# geometry for yours). One viewer, two states: idle clock <-> a fetched
# image view, with tap-to-refresh and honest captions.
#
# This is a PATTERN file: LVGL widgets can't merge in via packages, so you
# copy the blocks below into your device yaml and adjust ids/geometry.
# Production ancestors: a 4" voice box (network-map viewer) and a 7" wall
# console (cameras + voice + map) - both running today.
# =============================================================================

# --- The on-demand image feed (any URL that returns a JPEG) ------------------
http_request:
  id: dv_http
  timeout: 5s          # a stalled server must fail the fetch, not reboot you

online_image:
  - id: dv_image
    url: "http://YOUR-SERVER/local/rendered_view.jpg"
    format: JPEG
    type: RGB565
    update_interval: never          # on-demand ONLY - nothing polls
    resize: 448x290                 # = the viewer's inner content band
    on_download_finished:
      - lvgl.image.update: {id: dv_img_widget, src: dv_image}   # MANDATORY rebind
      - lvgl.widget.show: dv_img_widget
      - lvgl.widget.hide: dv_idle_clock
      - lvgl.label.update: {id: dv_caption, text: "TAP TO REFRESH"}
    on_error:
      - lvgl.label.update: {id: dv_caption, text: "FETCH FAILED - TAP TO RETRY"}

script:
  - id: dv_fetch
    mode: restart
    then:
      - lvgl.label.update: {id: dv_caption, text: "FETCHING..."}
      - component.update: dv_image
  # ~12s after a view arrives, hand the viewer back to the idle clock
  - id: dv_return_to_idle
    mode: restart
    then:
      - delay: 12s
      - lvgl.widget.hide: dv_img_widget
      - lvgl.widget.show: dv_idle_clock
      - lvgl.label.update: {id: dv_caption, text: "TAP TO LOAD"}

