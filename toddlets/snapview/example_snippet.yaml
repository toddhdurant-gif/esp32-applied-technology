# =============================================================================
# SNAPVIEW - example wiring (copy into your device yaml and adjust)
# Shows: the package include, the substitutions, and the two LVGL widgets
# SnapView renders into. Tested pattern - a production wall panel runs this
# against Frigate with two cameras.
# =============================================================================

substitutions:
  # --- SnapView ---
  sv_image_widget_id: img_view
  sv_caption_id: lbl_view_caption
  # Any URL that returns a JPEG. Frigate's snapshot API shown here:
  sv_cam1_url: "http://YOUR-FRIGATE-HOST:5000/api/front_door/latest.jpg"
  sv_cam2_url: "http://YOUR-FRIGATE-HOST:5000/api/driveway/latest.jpg"
  sv_cam1_name: "FRONT DOOR"
  sv_cam2_name: "DRIVEWAY"
  # Fit box for the fetched frame (scale-to-fit, aspect preserved).
  # Size it to your viewer's inner content band:
  sv_resize: "448x290"

packages:
  snapview: !include snapview.yaml

# Recommended watchdog backstop (a stalled camera must NEVER reboot you):
esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"

