# ==============================================================================
# THE COMMUNICATIONS BUTTON — a voice surface that never lies to you
# ==============================================================================
# Extracted from a working, hardware-verified build (Waveshare
# ESP32-S3-Touch-LCD-4B wall console — ES8311 speaker DAC + ES7210 mic ADC,
# 480x480 touchscreen, ESPHome + Home Assistant Assist).
#
# What this gives you that a bare voice_assistant block doesn't:
#
#   1. STATE COLORS FOR EVERY PIPELINE STAGE — the button border + state line
#      change at listening / processing / responding / error. You always know
#      whether it heard you.
#   2. A BUSY GUARD instead of silent dead taps — tapping mid-run shows
#      "STILL WORKING…" rather than corrupting the active pipeline run.
#   3. A DELAYED "PROCESSING" AUDIO CUE that only plays when the assistant is
#      actually slow (2.5s gate, measured on real runs — fast answers get
#      silence, slow ones get feedback).
#   4. TEXT ECHO — what it heard ("> your words") and the answer text are
#      rendered on screen, so a mis-recognition is visible instantly.
#   5. A WATCHDOG RESET — the button can never stick in "RESPONDING": a 1s
#      tick returns it to ready the moment the pipeline truly finishes.
#   6. A SANE VOLUME ARCHITECTURE — one knob controls everything (see the
#      boot block; the two-layer volume trap is explained in the README).
#
# This file is a REFERENCE EXTRACT, not a complete device config: merge it
# into a config that already has your board's display, touchscreen, wifi,
# and api blocks. Every id is self-consistent within this file. Pin numbers
# and codec choices below are the sample board's — swap for your hardware.
# No wake word is used (tap-to-talk by design); add ESPHome's micro_wake_word
# if you want hands-free.
# ==============================================================================

# ---------------- AUDIO HARDWARE (sample board: ES8311 out / ES7210 in) ------
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
    i2s_mclk_pin: GPIO5

audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

audio_adc:
  - platform: es7210
    id: es7210_codec
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 33db

microphone:
  - platform: i2s_audio
    id: main_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: main_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO6
    dac_type: external
    channel: mono
  # Two resamplers, both pass-through when the source is already 16k:
  # media arrives 44.1kHz, HA TTS announcements arrive as WAV; the hardware
  # runs 16kHz. Learned on real hardware — without these, pitch breaks.
  - platform: resampler
    id: resampler_speaker
    output_speaker: main_speaker
    sample_rate: 16000
  - platform: resampler
    id: announcement_resampler
    output_speaker: main_speaker
    sample_rate: 16000

# THE LOAD-BEARING DECISION: the voice assistant runs in MEDIA_PLAYER mode,
# not speaker mode. Naming a speaker media_player routes HA TTS through the
# announcement pipeline; if a speaker-mode voice_assistant ALSO streams raw
# audio to the same speaker, the two consumers fight — pitch shifts up
# ("helium voice"), the UI sticks in Responding, and the log fills with
# "buffer is full". Cost three flash cycles to root-cause. Media-player mode
# gives ONE audio consumer, and as a bonus the device shows up in HA as a
# real media player (announcements, Music Assistant, etc.).
media_player:
  - platform: speaker
    id: catalog_player
    name: "Speaker"
    media_pipeline:
      speaker: resampler_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_resampler
      format: WAV
      sample_rate: 16000
      num_channels: 2
    # The "Processing" cue — a short embedded WAV (~1.6s). Generate your own
    # (any TTS or tone; see README) and keep it CANONICAL 16-byte-fmt WAV at
    # 16kHz stereo — extended-fmt (18-byte) headers fail to parse.
    files:
      - id: processing_wav
        file: audio/processing.wav

# Fleet rule: every button chirps on press — EXCEPT this one. A chirp before
# the mic grab corrupts the recording via I2S bus contention (confirmed on
# hardware, twice). The talk button stays silent on press by design.

# ---------------- THE STATE MACHINE ------------------------------------------
voice_assistant:
  id: va_local
  microphone: main_mic
  media_player: catalog_player
  use_wake_word: false
  on_listening:
    - lvgl.widget.update: {id: talk_panel, border_color: c_violet}
    - lvgl.label.update: {id: lbl_tap, text: "LISTENING…"}
    - lvgl.widget.update: {id: lbl_tap, text_color: c_violet}
  # The cue timer arms the moment SPEECH ENDS (VAD), not at STT completion —
  # measured on real runs, the gate then spans the true dead air
  # (STT 1.5–2.0s + conversation agent 0.2–1.9s). Deterministic: total
  # silence beyond the gate = cue plays; anything faster = clean silence.
  on_stt_vad_end:
    - lambda: 'ESP_LOGI("va_timing", "vad_end at %lu ms", (unsigned long) millis());'
    - globals.set: {id: g_tts_started, value: 'false'}
    - script.execute: processing_cue_delayed
  on_stt_end:
    - lvgl.widget.update: {id: talk_panel, border_color: c_warn}
    - lvgl.label.update: {id: lbl_tap, text: "PROCESSING…"}
    - lvgl.widget.update: {id: lbl_tap, text_color: c_warn}
    # Stage timing instrumentation — capture with `esphome logs` during any
    # test and you can SEE where the seconds go (numbers in the README).
    - lambda: 'ESP_LOGI("va_timing", "stt_end at %lu ms", (unsigned long) millis());'
    # Echo what it heard. ASCII "> " prefix on purpose: fancy glyphs not in
    # your compiled font render as tofu boxes.
    - lvgl.widget.show: lbl_voice_cmd
    - lvgl.label.update:
        id: lbl_voice_cmd
        text: !lambda 'return "> " + x;'
  on_tts_start:
    # Answer text arrived — a fast response cancels the pending cue.
    - globals.set: {id: g_tts_started, value: 'true'}
    - lambda: 'ESP_LOGI("va_timing", "tts_start at %lu ms", (unsigned long) millis());'
    - lvgl.widget.show: lbl_voice_ans
    - lvgl.label.update:
        id: lbl_voice_ans
        text: !lambda 'return x;'
  # GOTCHA (source-verified): on_end fires at PIPELINE end, which is BEFORE
  # local playback finishes. Only reset if genuinely idle; otherwise mark
  # Responding and let the 1s watchdog do the real reset when is_running
  # actually drops. Without this, the button resets mid-answer.
  on_end:
    - if:
        condition:
          voice_assistant.is_running: {}
        then:
          - globals.set: {id: g_va_responding, value: 'true'}
          - lvgl.label.update: {id: lbl_tap, text: "RESPONDING…"}
        else:
          - script.execute: voice_ready_reset
  on_error:
    - lvgl.widget.update: {id: talk_panel, border_color: c_bad}
    - lvgl.label.update: {id: lbl_tap, text: "ERROR — TAP TO RETRY"}
    - lvgl.widget.update: {id: lbl_tap, text_color: c_bad}
    - globals.set: {id: g_va_responding, value: 'false'}

globals:
  - id: g_va_responding
    type: bool
    initial_value: 'false'
  # Set when the answer text arrives; a pending cue checks it after the gate
  # and stays silent on fast responses.
  - id: g_tts_started
    type: bool
    restore_value: false
    initial_value: 'false'
  # Seconds until the on-screen answer auto-clears; 0 = disarmed.
  - id: g_ans_clear_s
    type: int
    restore_value: false
    initial_value: '0'

script:
  # The delayed Processing cue. Gate = 2500ms, measured not guessed:
  # command-class runs (~2.0s total dead air) never cue, query-class runs
  # (3.2s+) always do. mode: restart so a rapid re-tap can't stack cues.
  - id: processing_cue_delayed
    mode: restart
    then:
      - delay: 2500ms
      - if:
          condition: {lambda: 'return !id(g_tts_started);'}
          then:
            - media_player.speaker.play_on_device_media_file:
                id: catalog_player
                media_file: processing_wav
                announcement: true
  - id: voice_ready_reset
    then:
      - globals.set: {id: g_va_responding, value: 'false'}
      - lvgl.widget.update: {id: talk_panel, border_color: c_good}
      - lvgl.label.update: {id: lbl_tap, text: "TAP TO SPEAK"}
      - lvgl.widget.update: {id: lbl_tap, text_color: c_good}
      - lambda: 'ESP_LOGI("va_timing", "answer finished (ready reset) at %lu ms", (unsigned long) millis());'
      # The answer stays readable for 30s after the audio finishes, then the
      # text clears (the 1s tick below counts it down).
      - globals.set: {id: g_ans_clear_s, value: '30'}
  # Clearing just hides the text — the screen falls back to whatever your
  # idle/home background is. A plain dark panel is a perfectly good default;
  # in the working build a Settings-page chooser picks the background art,
  # which is a nice pattern if you want user-swappable art without reflashing.
  - id: hide_voice_text
    then:
      - lvgl.widget.hide: lbl_voice_cmd
      - lvgl.widget.hide: lbl_voice_ans

# One 1-second tick runs the watchdog AND the answer auto-clear (merge your
# other per-second work into the same block — one scheduler entry, not four).
interval:
  - interval: 1s
    then:
      # Watchdog: reset the talk surface the first tick after is_running
      # drops. This is what makes a stuck "RESPONDING…" impossible.
      - if:
          condition:
            and:
              - lambda: 'return id(g_va_responding);'
              - not:
                  voice_assistant.is_running: {}
          then:
            - script.execute: voice_ready_reset
      # 30s post-answer clear — never counts down while a run is active.
      - if:
          condition:
            and:
              - lambda: 'return id(g_ans_clear_s) > 0;'
              - not:
                  voice_assistant.is_running: {}
              - lambda: 'return !id(g_va_responding);'
          then:
            - lambda: 'id(g_ans_clear_s) -= 1;'
            - if:
                condition: {lambda: 'return id(g_ans_clear_s) == 0;'}
                then:
                  - script.execute: hide_voice_text

# ---------------- VOLUME: ONE KNOB, ALL SOUNDS EQUAL -------------------------
# Two independent volume layers stack MULTIPLICATIVELY: the media_player's
# software volume (scales voice answers + the cue, and silently restores a
# saved value at boot) and the codec DAC volume (scales everything). If you
# don't pin the media layer, answers come out quieter than everything else.
# Fix: pin media volume to 1.0 at every boot; let ONE control (a Settings
# slider driving audio_dac.set_volume) govern loudness. Never bind a slider
# to both layers — they re-stack at low positions.
#
# Add to your esphome: on_boot: (after the network stack, priority -100):
#
#   - audio_dac.set_volume:
#       id: es8311_codec
#       volume: 0.7
#   - media_player.volume_set:
#       id: catalog_player
#       volume: 1.0

# ---------------- COLORS + FONT (referenced above) ---------------------------
color:
  - id: c_good
    hex: "4AD4E3"   # ready — cyan
  - id: c_warn
    hex: "E8A94A"   # processing — amber
  - id: c_violet
    hex: "9D7BEA"   # listening
  - id: c_bad
    hex: "CC6666"   # error
  - id: c_surface
    hex: "0E131C"
  - id: c_ink
    hex: "DEE6EE"
  - id: c_ink_dim
    hex: "788696"

font:
  - file: "gfonts://Chakra+Petch@600"
    id: font_btn_sm
    size: 15
  - file: "gfonts://Chakra+Petch@500"
    id: font_voice
    size: 20

