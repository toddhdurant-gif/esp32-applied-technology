# ============================================================================
# PUBLIC / STERILIZED BUILD (wp47d2_public_v5.7) - generated 2026-08-14
# Derived from wp47d2_rebuild v5.7 (the locked production GUI) with:
#   - all licensed/trademarked artwork and terms removed (original art only)
#   - every credential externalized to secrets.yaml (see secrets.yaml.example)
#   - network addresses parameterized in the substitutions block below
# Compiles as-shipped from this folder. Icons: Material Design Icons
# (Templarian/MaterialDesign, Apache 2.0). Ship schematic: original drawing.
# ============================================================================
# Board: Waveshare ESP32-P4-WIFI6-DEV-KIT (WP47D2 / Display 2)
# 32mb psram, 32mb flash (16MB flash_size is what boots - do not "fix"),
# 720x1280, ILI9881C panel, ES8311 codec + ES7210 mic ADC, GT911 touch.
#
# CONFIG: WP47D2 REBUILD S1 - started 2026-08-09 after the 1:37 PM add-on
# reflash left the device dark with app1 erased (no rollback partition).
# Clean staged rebuild per Todd's direction: standard components only,
# retro-terminal styling later, no custom fonts / PUA glyphs / embedded
# assets. Stage 1 = Section 1 of wp47d2_gold_v1.yaml verbatim (the proven
# must-have-to-flash zone), minus the LVGL/script hooks that don't exist yet.
# Same device name + API key as always so HA reattaches to the existing
# entities. Built with the local toolchain (TCM assert patch verified
# intact 2026-08-09 before this compile).

###############################################################################
# SECTION: 1. DEVICE IDENTITY & NETWORK
###############################################################################

esphome:
  name: "wp47d2"
  friendly_name: "wp47d2"
  project:
    name: "durant.wp47d2"
    version: "v5.7-public-2026-08-14"
  # v3.8: sync the VOL slider UI to the media_player's flash-restored volume
  # at boot, so the slider always shows the one real volume. Priority -100 =
  # runs after every component (incl. media_player restore + LVGL) is up.
  on_boot:
    priority: -100.0
    then:
      - lvgl.slider.update:
          id: slider_vol
          value: !lambda 'return (int)(id(display2_media).volume * 100.0f);'
      # v3.9 diagnostic: log what the ES8311 DAC register ACTUALLY holds
      # after the media_player's boot restore - proves whether the restore
      # write landed in the codec.
      - lambda: |-
          ESP_LOGI("audio_diag", "boot: media_player volume=%.0f%% -> DAC reg readback=%.0f%%",
                   id(display2_media).volume * 100.0f, id(audio_codec).volume() * 100.0f);

api:
  encryption:
    key: !secret wp47d2_api_key
  on_client_connected:
    - lvgl.label.update: {id: status_msg, text: "HA LINK ESTABLISHED"}
    - script.execute: fetch_summaries

esp32:
  variant: ESP32P4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf
    # Both PSRAM-stack flags off, verified in the final generated
    # sdkconfig.wp47d2 after compile before flashing (fleet rule).
    sdkconfig_options:
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "n"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "n"

ota:
  - platform: esphome
    id: ota_esphome_1
    port: 3232
    password: !secret wp47d2_ota_password
    allow_partition_access: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${device_static_ip}
    gateway: ${gateway_ip}
    subnet: 255.255.255.0
    dns1: ${gateway_ip}
  on_connect:
    - lvgl.label.update: {id: wifi_status_icon, text_color: "${c_green}"}
    - lvgl.label.update: {id: status_msg, text: "WIFI LINK ESTABLISHED"}
  on_disconnect:
    - lvgl.label.update: {id: wifi_status_icon, text_color: "${c_red}"}
    - lvgl.label.update: {id: status_msg, text: "WIFI LINK LOST"}

esp32_hosted:
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  type: sdio
  variant: ESP32C6

update:
  - platform: esp32_hosted
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    name: C6 Firmware

psram:
  mode: hex
  speed: 200MHZ

web_server:

mdns:
  disabled: false

http_request:
  verify_ssl: false

# CAMERA STAGE (2026-08-13, Todd's ask): Frigate snapshot fetch into the main
# viewer, ported from this device's own proven wp47d2_landscape.yaml mechanism
# (URLs + the on_download_finished -> lvgl.image.update redraw fix, which is
# mandatory - `src:` alone binds only once at setup, see the fleet checklist).
# One shared online_image; the two camera buttons retarget it via set_url.
# update_interval: never - fetch only on button tap, per the fleet's
# on-demand-over-polling rule.
online_image:
  - id: viewer_cam_img
    url: "http://${ha_host_ip}:5000/api/p2/latest.jpg"
    format: JPEG
    type: RGB565
    # view_frame inner box is 712x452 (720x460 minus 4px border) - resize
    # fits-within preserving aspect, same behavior confirmed on the old build.
    resize: 712x452
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: viewer_cam_widget
          src: viewer_cam_img
      - lvgl.widget.show: viewer_cam_widget
      # v4.4 Stage B: name the actual camera, and stamp the age clock.
      - lambda: |-
          id(g_snap_time) = id(sntp_time).now().is_valid()
                            ? (int) id(sntp_time).now().timestamp : 0;
      - lvgl.label.update:
          id: status_msg
          text: !lambda 'static std::string r; r = id(g_snap_name) + " ON MAIN VIEWER"; return r.c_str();'
      - lvgl.widget.show: age_ring
      - lvgl.widget.show: age_text
      - lvgl.widget.show: age_caption

logger:
  hardware_uart: UART0
  level: DEBUG

network:
  enable_ipv6: false


###############################################################################
# SECTION: 3. HARDWARE ABSTRACTION LAYER (Stage 2)
# Every value below is from Todd's last-working Display 2 yaml
# (WP47D2_Landscape__Display_2.yaml) - proven on this exact board,
# not re-derived. Touch transform stays vendor-default (all false);
# lvgl rotation: 90 does the landscape work.
###############################################################################

i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8

esp_ldo:
  - id: mipi_phy_ldo
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: display1
    model: WAVESHARE-7-DSI-TOUCH-A
    reset_pin: GPIO27

touchscreen:
  - platform: gt911
    id: touch1
    i2c_id: bus_a
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    # Diagnostic only (remove once touch is confirmed): logs all three
    # pipeline stages per tap - raw sensor, this transform's output, and
    # the value LVGL actually hit-tests after its rotation:90 remap
    # (final_x = y, final_y = native_width-1 - x, native width 720).
    on_touch:
      - if:
          condition:
            lambda: 'return id(g_dimmed);'
          then:
            - script.execute: wake_from_timeout
      - lambda: |-
          int final_x = touch.y;
          int final_y = 719 - touch.x;
          ESP_LOGI("touch_diag", "FINAL(lvgl)=(%d,%d) | transform=(%d,%d) | raw=(%d,%d)",
              final_x, final_y, touch.x, touch.y, touch.x_raw, touch.y_raw);

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO26
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON


###############################################################################
# SECTION: 3b. AUDIO (Stage v3.0 - PLAYBACK ONLY; mic/voice = next stage)
# All values from WP47D2_Landscape__Display_2.yaml (Todd-proven on this
# board): I2S pins 10/12/13, ES8311 @0x18 on bus_a, DOUT GPIO9 stereo,
# timeout: never (bus-busy fix), PA enable GPIO53 active-high (the
# historic "silent despite everything working" root cause).
###############################################################################

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_dac:
  - platform: es8311
    id: audio_codec
    i2c_id: bus_a
    address: 0x18
    use_mclk: true
    use_microphone: false

audio_adc:
  - platform: es7210
    id: mic_adc
    i2c_id: bus_a

switch:
  - platform: gpio
    pin: GPIO53
    id: speaker_pa_enable
    name: "Audio PA Enable"
    restore_mode: ALWAYS_ON

speaker:
  - platform: i2s_audio
    id: beep_speaker
    i2s_audio_id: i2s_bus
    audio_dac: audio_codec
    dac_type: external
    i2s_dout_pin: GPIO9
    channel: stereo
    timeout: never

  - platform: resampler
    id: announce_resampler
    output_speaker: beep_speaker

rtttl:
  id: beeper
  speaker: beep_speaker
  # v3.9: 0.5 -> 1.0 (+6 dB) fixed "far too quiet"; v3.9.1: Todd live:
  # "much too loud, cut it back by a third" -> 0.65.
  gain: 0.65

media_player:
  - platform: speaker
    id: display2_media
    name: "Display 2 Computer Voice"
    # v3.8 AUDIO FIX. Root cause of "very very low audio": this component
    # restores volume at EVERY boot (flash pref, else volume_initial whose
    # ESPHome default is 0.5) and pushes it through announce_resampler ->
    # beep_speaker -> ES8311 DAC (forwarding confirmed in ESPHome source).
    # The ES8311 maps volume LINEARLY to its 0-255 register at 0.5 dB/step
    # with 0 dB at 0.75 - so 0.5 = -31.5 dB (whisper), and the old direct
    # slider range 0-100% spanned -95.5..+32 dB (mostly inaudible travel).
    # volume_min/max below remap the user-facing 0-100% into the USEFUL
    # window: 0% = -25.5 dB, ~62% = 0 dB, 100% = +32 dB (digital gain -
    # top end can clip on loud sources; that's the user's call).
    # 0% via HA still hard-mutes (mute logic keys off the unbounded value).
    # v3.10 (Todd live: "very screechy"): the old max of 100% drove the DAC
    # to +32 dB digital gain - pure clipping distortion, and slider travel
    # up there is inaudible (everything is already at the ceiling). New
    # window caps at 75% = the ES8311's 0 dB point: 0% = -25.5 dB quiet,
    # 100% = 0 dB clean maximum. Loudness now comes from rtttl gain and the
    # analog stage, never from digital overdrive.
    volume_initial: 80%
    volume_min: 55%
    volume_max: 75%
    # v3.8 (Todd's live request 2026-08-10): audible feedback on every volume
    # change - a short chirp AT the new level, from HA or the VOL slider
    # alike. Side effect: one chirp at boot when the restored volume applies
    # (doubles as an "audio system online" ack). Dragging the HA slider can
    # chirp per step - that's the feedback working.
    on_volume:
      - rtttl.play: "volack:d=32,o=6,b=250:e,g"
    announcement_pipeline:
      speaker: announce_resampler
      format: WAV

microphone:
  - platform: i2s_audio
    id: display2_mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO11
    channel: left
    bits_per_sample: 16bit
    sample_rate: 16000

voice_assistant:
  id: va
  microphone: display2_mic
  speaker: announce_resampler
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_listening:
    - lvgl.widget.show: va_vortex
    - lvgl.widget.show: va_vortex2
    - lvgl.widget.show: va_vortex3
    - lvgl.widget.update: {id: comms_btn, bg_color: "${c_green}"}
    - lvgl.label.update: {id: comms_state, text: "LISTENING"}
    - lvgl.label.update: {id: status_msg, text: "INTERFACE ENGINE - LISTENING"}
  on_stt_vad_end:
    - rtttl.play: "ack:d=16,o=6,b=200:c,e,g"
    - lvgl.widget.update: {id: comms_btn, bg_color: "${c_amber}"}
    - lvgl.label.update: {id: comms_state, text: "PROCESSING"}
    - lvgl.label.update: {id: status_msg, text: "INTERFACE ENGINE - PROCESSING"}
  on_stt_end:
    - lvgl.label.update:
        id: status_msg
        text: !lambda 'static std::string r; r = "HEARD: " + x; return r.c_str();'
  on_tts_start:
    - script.execute: msd_hide
    - script.execute: viewer_gauges_hide
    - lvgl.widget.hide: viewer_cam_widget
    - lvgl.widget.show: va_vortex
    - lvgl.widget.show: va_vortex2
    - lvgl.widget.show: va_vortex3
    - lvgl.label.update:
        id: viewer_placeholder
        text: !lambda 'static std::string r; r = x; return r.c_str();'
  on_tts_stream_end:
    - lvgl.widget.hide: va_vortex
    - lvgl.widget.hide: va_vortex2
    - lvgl.widget.hide: va_vortex3
    - script.execute: viewer_reset_timer
    - lvgl.widget.update: {id: comms_btn, bg_color: "${c_comms}"}
    - lvgl.label.update: {id: comms_state, text: "TAP TO SPEAK"}
    - lvgl.label.update: {id: status_msg, text: "INTERFACE ENGINE READY"}
  on_end:
    - lvgl.widget.hide: va_vortex
    - lvgl.widget.hide: va_vortex2
    - lvgl.widget.hide: va_vortex3
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - lvgl.widget.update: {id: comms_btn, bg_color: "${c_comms}"}
          - lvgl.label.update: {id: comms_state, text: "TAP TO SPEAK"}
  on_error:
    - lvgl.widget.hide: va_vortex
    - lvgl.widget.hide: va_vortex2
    - lvgl.widget.hide: va_vortex3
    - script.execute: viewer_reset_timer
    - lvgl.widget.update: {id: comms_btn, bg_color: "${c_red}"}
    - lvgl.label.update: {id: comms_state, text: "ERROR - TAP TO RETRY"}
    - lvgl.label.update:
        id: status_msg
        text: !lambda 'static std::string r; r = "INTERFACE ENGINE ERROR: " + code; return r.c_str();'
    - delay: 2s
    - lvgl.widget.update: {id: comms_btn, bg_color: "${c_comms}"}
    - lvgl.label.update: {id: comms_state, text: "TAP TO SPEAK"}


###############################################################################
# SECTION: 2. DESIGN LOGIC & OPTIONS (Stage 3)
# GOLD STANDARD v1 palette, ported verbatim from wp47d2_gold_v1.yaml.
###############################################################################

substitutions:
  config_name: "WP47D2 v5.7 PUBLIC"
  # ---- YOUR NETWORK - edit these three values ----
  device_static_ip: "192.168.1.50"   # a free static IP for the display
  gateway_ip: "192.168.1.1"          # your router
  ha_host_ip: "192.168.1.10"         # your Home Assistant host
  c_home: "0xA9D3EE"
  c_comms: "0xCC99CC"
  c_batt: "0x4DB380"      # v4.0 darker green (DEVICE STATUS tab, Todd contrast ask 2026-08-12)
  c_lights: "0xF2D45C"    # periwinkle  # v3.12 mockup-approved yellow
  c_devices: "0xA98BE8"   # lavender
  c_zigbee: "0x9999CC"
  c_orange: "0xFF9900"
  c_blue: "0x99CCFF"
  c_amber: "0xFFCC66"
  c_red: "0xCC6666"
  c_green: "0x66CC99"
  c_paper: "0xE8E8FF"
  c_dim: "0x666688"
  # Tab ramp additions (v2.6 palette): distinct cool hues, black-text safe
  t_repairs: "0x66CCCC"   # teal - v3.19: was amber 0xF2B35C, clashed with energy orange + new amber accents
  t_updates: "0x6C8FD8"   # steel blue
  t_energy: "0xFF9900"    # orchid  # v3.12 mockup-approved orange
  # v4.4 (Todd live 2026-08-13): teal read too close to DEVICE STATUS green at
  # a glance. CRITICAL SENSORS moves to ice-white - maximum separation
  # from every other tab, and the green/red state dot reads hardest on it.
  # v4.9 (Todd: white is "the most unimaginative color"). Rose - the one
  # warm hue no other tab occupies, black-text safe, far enough from the
  # comms orchid not to clash. One-token swap for the other FM-2
  # candidates: coral 0xE88B7D, sand 0xD9BE9A, pale mint 0x9EE8C4.
  c_sensors: "0xE39AAE"   # rose - CRITICAL SENSORS tab
  # v4.7 (Todd 2026-08-13): Home Assistant's own brand blue, so the two HA
  # buttons read as "this is Home Assistant" the way the HA logo does.
  # #18BCF2 is HA's published brand blue; the dark tone is the logo
  # watermark that the button text now sits on top of.
  c_ha: "0x18BCF2"
  c_ha_dark: "0x0B6A8A"

# Primary clock = sntp WITH explicit timezone (the old wrong-clock bug was
# sntp defaulting to UTC, not sntp itself). ha_time kept as well - it wasn't
# receiving time pushes on the rebuild despite a healthy API connection
# (suspect the HA ESPHome integration entry needs a reload after the rebuild).
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    timezone: America/Chicago
    on_time_sync:
      - lvgl.label.update: {id: status_msg, text: "ALL SYSTEMS ONLINE"}

# v3.11: live weather in the header (Todd's ask 2026-08-10). Source is the
# house's own HA weather entity (Rock Canyon), pushed on change - no polling.
sensor:
  - platform: homeassistant
    id: wx_temp
    entity_id: weather.rock_canyon_rock_canyon_weather
    attribute: temperature
    on_value:
      - script.execute: update_wx_line

text_sensor:
  - platform: homeassistant
    id: wx_state
    entity_id: weather.rock_canyon_rock_canyon_weather
    on_value:
      - script.execute: update_wx_line

image:
  # Idle/MSD art = original "U.S.S. Durant" schematic, drawn from scratch
  # (no licensed artwork). Live-data callouts overlay it.
  - file: "uss_durant_msd_712x452.png"
    id: msd_img
    type: RGB565

font:
