                  value: !lambda 'return (int) x;'
              # v3.8: route through the media_player (one volume authority,
              # HA-visible, persists across boots). Direct audio_dac writes
              # got silently overwritten by the media_player's boot restore.
              - media_player.volume_set:
                  id: display2_media
                  volume: !lambda 'return x / 100.0;'
              # v3.10: direct DAC write REMOVED again - v3.9's readback proved
              # writes land in the codec (slider 75% -> readback 75%), so the
              # media_player is safely the ONE volume authority now that its
              # window is capped at the 0 dB point. Readback log kept.
              - lambda: |-
                  float rb = id(audio_codec).volume();
                  ESP_LOGI("audio_diag", "VOL slider=%d%% -> DAC reg readback=%.0f%%", (int) x, rb * 100.0f);
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - lvgl.widget.hide: slider_vol
              - lvgl.label.update:
                  id: status_msg
                  text: !lambda 'static std::string r; r = "VOLUME SET: " + std::to_string((int) x) + "%"; return r.c_str();'
        - slider:
            id: slider_brt
            hidden: true
            x: 480
            y: 290
            width: 700
            height: 44
            min_value: 25
            max_value: 100
            value: 80
            bg_color: 0x33323e
            indicator:
              bg_color: ${c_home}
            knob:
              bg_color: ${c_home}
            on_release:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0;'
              - lvgl.widget.hide: slider_brt
              - lvgl.label.update:
                  id: status_msg
                  text: !lambda 'static std::string r; r = "BRIGHTNESS SET: " + std::to_string((int) x) + "%"; return r.c_str();'

