    file: "gfonts://Montserrat@700"
    size: 24
    bpp: 4
  - id: montserrat_bold_28
    file: "gfonts://Montserrat@700"
    size: 28
    bpp: 4
  # v3.21: Material Design Icons (HA's own icon language). Apache 2.0 -
  # attribution: Templarian/MaterialDesign. Codepoints verified against the
  # project's published materialdesignicons.css 2026-08-11, not guessed.
  # Plane-15 PUA codepoints REQUIRE the 8-digit \U escape form.
