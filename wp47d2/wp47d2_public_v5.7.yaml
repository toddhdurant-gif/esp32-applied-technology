  - id: montserrat_bold_12
    file: "gfonts://Montserrat@700"
    size: 12
    bpp: 4


###############################################################################
# SECTION: 4. UI (Stage 3 - GOLD layout skeleton, standard components only)
# Geometry ported from wp47d2_gold_v1.yaml (design authority:
# WP47D2_GOLD_STANDARD_v1.html). Per FLEET_BUILD_STANDARD addendum
# 2026-08-09 section 7: no PUA/custom glyphs - the three header icons use
# LVGL's built-in LV_SYMBOL codepoints as ASCII yaml escapes (wifi F1EB,
# battery-full F240, gear F013) on the BUILT-IN montserrat_20 face (gfonts
# faces don't carry the symbol range). rtttl acks, camera fetch, voice, and
# detail views arrive in their own later stages - cam/comms buttons echo to
# the status bar for now. Tab recolor interaction (the GOLD signature) is
# fully live.
###############################################################################

interval:
  - interval: 60s
    then:
      - script.execute: fetch_summaries
  # v5.4: snapshot-age readout (green under 60s, amber past it)
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(g_snap_time) > 0 && id(sntp_time).now().is_valid();'
          then:
            - lvgl.arc.update:
                id: age_ring
                value: !lambda |-
                  int age = (int) id(sntp_time).now().timestamp - id(g_snap_time);
                  if (age < 0) age = 0;
                  return age > 60 ? 60 : age;
            - lvgl.label.update:
                id: age_text
                text: !lambda |-
                  static std::string r;
                  int age = (int) id(sntp_time).now().timestamp - id(g_snap_time);
                  if (age < 0) age = 0;
                  char b[16];
                  if (age < 60) snprintf(b, sizeof(b), "%dS", age);
                  else snprintf(b, sizeof(b), "%d:%02d", age / 60, age % 60);
                  r = b;
                  return r.c_str();
            - if:
                condition:
                  lambda: 'return ((int) id(sntp_time).now().timestamp - id(g_snap_time)) >= 60;'
                then:
                  - lvgl.arc.update: {id: age_ring, indicator: {arc_color: "${c_amber}"}}
                  - lvgl.label.update: {id: age_text, text_color: "${c_amber}"}
                else:
                  - lvgl.arc.update: {id: age_ring, indicator: {arc_color: "${c_green}"}}
                  - lvgl.label.update: {id: age_text, text_color: "${c_green}"}
  # v4.7 alarm blink. Two boolean tests per tick when nothing is wrong.
  - interval: 600ms
    then:
      - lambda: 'id(g_flash_phase) = !id(g_flash_phase);'
      - if:
          condition:
            lambda: 'return id(g_flash_core);'
          then:
            - if:
                condition:
                  lambda: 'return id(g_flash_phase);'
                then:
                  - lvgl.widget.update: {id: msd_core_ha, bg_color: "${c_amber}"}
                else:
                  - lvgl.widget.update: {id: msd_core_ha, bg_color: 0x1A1A1A}
      - if:
          condition:
            lambda: 'return id(g_flash_sens);'
          then:
            - if:
                condition:
                  lambda: 'return id(g_flash_phase);'
                then:
                  - lvgl.widget.update: {id: msd_core_sens, bg_color: "${c_red}"}
                else:
                  - lvgl.widget.update: {id: msd_core_sens, bg_color: 0x1A1A1A}
  - interval: 1s
    then:
      - lvgl.label.update:
          id: status_line
          text: !lambda |-
            static std::string r;
            auto now = id(sntp_time).now();
            if (now.is_valid()) {
              char tb[16];
              now.strftime(tb, sizeof(tb), "%l:%M");
              r = std::string(tb) + (now.hour < 12 ? " am" : " pm");
            } else {
              r = "syncing";
            }
            return r.c_str();
      - lvgl.label.update:
          id: date_line
          text: !lambda |-
            static std::string r;
            auto now = id(sntp_time).now();
            if (now.is_valid()) {
              // v3.11: no leading zeros (8/10/2026, not 08/10/2026)
              char db[16];
              snprintf(db, sizeof(db), "%d/%d/%d", now.month, now.day_of_month, now.year);
              r = db;
            } else {
              r = "--/--/----";
            }
            return r.c_str();
      - lvgl.label.update:
          id: idle_clock
          text: !lambda |-
            static std::string r;
            auto now = id(sntp_time).now();
            if (now.is_valid()) {
              char tb[16];
              now.strftime(tb, sizeof(tb), "%l:%M");
              r = std::string(tb) + (now.hour < 12 ? " am" : " pm");
            } else { r = ""; }
            return r.c_str();
      - lvgl.label.update:
          id: idle_date
          text: !lambda |-
            static std::string r;
            auto now = id(sntp_time).now();
            if (now.is_valid()) {
              char db[24];
              now.strftime(db, sizeof(db), "%A");
              char d2[40];
              snprintf(d2, sizeof(d2), "%s %d/%d", db, now.month, now.day_of_month);
              r = d2;
            } else { r = ""; }
            return r.c_str();

globals:
  - id: g_dimmed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_brt_saved
    type: float
    restore_value: false
    initial_value: '0.8'
  - id: g_volume
    type: int
    restore_value: true
    initial_value: '50'
  - id: g_view_home
    type: bool
    restore_value: false
    initial_value: 'true'
  # v4.4 Stage B: epoch second the viewer snapshot finished downloading, and
  # the friendly name of whichever camera it came from. 0 = no snapshot on
  # screen, which hides the age ring entirely.
  - id: g_snap_time
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_snap_name
    type: std::string
    restore_value: false
    initial_value: '""'
  # v4.7: Todd asked for the CORE UPDATES dot to flash when something is
  # actually pending - "I think that's the only one that we want
  # flashing" - and then asked whether CRIT SENSORS should too. Both get
  # the mechanism; both only fire on a real alarm state, so a healthy
  # board stays completely still.
  - id: g_flash_core
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_flash_sens
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_deep
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_flash_phase
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  # v3.16: live tab data - HA computes each display string server-side via
  # /api/template (the OLD landscape build's proven pattern + exact templates,
  # ported verbatim, only the output words restyled to terminal caps).
  - id: fetch_summaries
    mode: restart
    then:
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{% set t = ['sensor.family_room_broadlink_remote_temperature','sensor.master_echo_temperature_2','sensor.smartthings_motion_sensor_temperature','sensor.3rd_bay_bluecharm_bc021pro_temperature'] | map('states') | select('ne','unknown') | select('ne','unavailable') | map('float') | list %}{{ t | min | round(0) | int }}\u00B0 - {{ t | max | round(0) | int }}\u00B0F IN"
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lvgl.label.update: {id: v_lights, text: !lambda 'return body.c_str();'}
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{{ states.sensor | selectattr('attributes.device_class','defined') | selectattr('attributes.device_class','eq','battery') | rejectattr('state','in',['unknown','unavailable']) | map(attribute='state') | map('int') | select('le',20) | list | count }} LOW BAT - {{ issues() | length }} REPAIRS"
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lvgl.label.update: {id: v_batt, text: !lambda 'return body.c_str();'}
            # v4.7: the board gets a compact form - the tab's full
            # sentence wrapped to two lines in a 170px callout.
            - lvgl.label.update:
                id: msd_v_batt
                text: !lambda |-
                  static std::string r;
                  int low = 0, rep = 0;
                  sscanf(body.c_str(), "%d LOW BAT - %d", &low, &rep);
                  char b[32];
                  snprintf(b, sizeof(b), "%d BAT / %d REP", low, rep);
                  r = b;
                  return r.c_str();
            # v4.0: one call carries both counts - parse "N LOW BAT - M REPAIRS"
            - if:
                condition:
                  lambda: |-
                    int low = 0, rep = 0;
                    sscanf(body.c_str(), "%d LOW BAT - %d", &low, &rep);
                    return (low > 0) || (rep > 0);
                then:
                  # v4.7: the tab's own LED is gone (Todd's call); the MSD
                  # board node is now the only place this state shows.
                  - lvgl.widget.update: {id: msd_core_batt, bg_color: "${c_red}"}
                else:
                  - lvgl.widget.update: {id: msd_core_batt, bg_color: "${c_green}"}
            # v4.0: header battery icon = fleet low-battery state (Todd-approved rec #3)
            - if:
                condition:
                  lambda: 'return atoi(body.c_str()) > 0;'
                then:
                  - lvgl.label.update: {id: batt_icon, text_color: "${c_amber}"}
                else:
                  - lvgl.label.update: {id: batt_icon, text_color: "${c_green}"}
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{{ states.update | selectattr('state','eq','on') | list | count }} AVAIL"
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lvgl.label.update: {id: v_updates, text: !lambda 'return body.c_str();'}
            - lvgl.label.update: {id: msd_v_upd, text: !lambda 'return body.c_str();'}
            - lvgl.label.update:
                id: badge_upd_lbl
                text: !lambda 'static std::string r; r = std::to_string(atoi(body.c_str())); return r.c_str();'
            - if:
                condition:
                  lambda: 'return atoi(body.c_str()) > 0;'
                then:
                  - lvgl.widget.update: {id: msd_core_upd, bg_color: "${c_amber}"}
                  - lvgl.widget.show: badge_upd
                else:
                  - lvgl.widget.update: {id: msd_core_upd, bg_color: "${c_green}"}
                  - lvgl.widget.hide: badge_upd
            # badge goes red at 5+ pending updates (Todd-approved rec #1)
            - if:
                condition:
                  lambda: 'return atoi(body.c_str()) >= 5;'
                then:
                  - lvgl.widget.update: {id: badge_upd, bg_color: "${c_red}"}
                else:
                  - lvgl.widget.update: {id: badge_upd, bg_color: "${c_orange}"}
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{% set ids = ['sensor.attic2_kasa_current_consumption','sensor.hair_dryer_kasa_current_consumption','sensor.master_kasa_current_consumption','sensor.master_kasa2_current_consumption','sensor.cave_kasa_current_consumption','sensor.credenza_kasa_current_consumption','sensor.smart_switch_24100979083345512004c4e7ae0d2ac4_power','sensor.smart_switch_24100919400168512004c4e7ae0d29eb_power','sensor.office_main_mss2_power','sensor.shelly_zwave_plug3z_electric_consumption_w','sensor.office_zwave_plug1_electric_consumption_w','sensor.kitchen_zwave_plug4_electric_consumption_w','sensor.attic_zwave_plug3_electric_consumption_w','sensor.mss2_power','sensor.master_bedroom_mastershellyplug1_power','sensor.office_officeshellyplug2_power'] %}{{ '%.1f'|format(ids | map('states') | select('ne','unknown') | select('ne','unavailable') | map('float',0) | sum) }} W"
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lvgl.label.update: {id: v_energy, text: !lambda 'return body.c_str();'}
            # v5.1: this mirror MUST live in THIS on_response - it briefly
            # sat in the core-updates response below and read "0".
            - lvgl.label.update: {id: msd_v_energy, text: !lambda 'return body.c_str();'}
            # v4.7: the energy node reads house load at a glance -
            # green under 900 W, amber to 1800 W, red above it.
            - if:
                condition:
                  lambda: 'return atof(body.c_str()) >= 1800.0f;'
                then:
                  - lvgl.widget.update: {id: msd_core_energy, bg_color: "${c_red}"}
                else:
                  - if:
                      condition:
                        lambda: 'return atof(body.c_str()) >= 900.0f;'
                      then:
                        - lvgl.widget.update: {id: msd_core_energy, bg_color: "${c_amber}"}
                      else:
                        - lvgl.widget.update: {id: msd_core_energy, bg_color: "${c_green}"}
      # v4.7: CRITICAL SENSORS is the top tab now, so it had to stop showing a
      # hardcoded "3/3 DRY". Live leak detectors, entity list enumerated from
      # HA on 2026-08-13 rather than pattern-guessed: 12 moisture binary
      # sensors exist, 6 currently report a real state (the rest sit
      # unknown/unavailable and are excluded rather than counted as dry).
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{% set w = states.binary_sensor | selectattr('attributes.device_class','defined') | selectattr('attributes.device_class','eq','moisture') | rejectattr('state','in',['unknown','unavailable']) | list %}{% set wet = w | selectattr('state','eq','on') | list | count %}{% if wet > 0 %}{{ wet }} WET{% else %}{{ w | count }}/{{ w | count }} DRY{% endif %}"
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            - lvgl.label.update: {id: v_sensors, text: !lambda 'return body.c_str();'}
            - lvgl.label.update: {id: msd_v_sens, text: !lambda 'return body.c_str();'}
            - if:
                condition:
                  lambda: 'return body.find("WET") != std::string::npos;'
                then:
                  - lvgl.led.update: {id: d_sensors, color: "${c_red}"}
                  - globals.set: {id: g_flash_sens, value: 'true'}
                else:
                  - lvgl.led.update: {id: d_sensors, color: "${c_green}"}
                  - globals.set: {id: g_flash_sens, value: 'false'}
                  - lvgl.widget.update: {id: msd_core_sens, bg_color: "${c_green}"}
      # v4.7: Home Assistant's OWN core/OS/supervisor updates - a different
      # number from the UPDATES tab (which counts every update entity in the
      # house). All three entity IDs verified present in HA 2026.8.1 on
      # 2026-08-13 before this was wired.
      - http_request.post:
          url: "http://${ha_host_ip}:8123/api/template"
          request_headers:
            Authorization: !secret ha_token_bearer
            Content-Type: "application/json"
          json:
            template: "{{ [states('update.home_assistant_core_update'), states('update.home_assistant_operating_system_update'), states('update.home_assistant_supervisor_update')] | select('eq','on') | list | count }}"
          capture_response: true
          max_response_buffer_size: 128
          on_response:
            - if:
                condition:
                  lambda: 'return atoi(body.c_str()) > 0;'
                then:
                  - lvgl.label.update:
                      id: msd_v_core
                      text: !lambda 'static std::string r; r = body + " PENDING"; return r.c_str();'
                  - globals.set: {id: g_flash_core, value: 'true'}
                else:
                  - lvgl.label.update: {id: msd_v_core, text: "CORE OK"}
                  - globals.set: {id: g_flash_core, value: 'false'}
                  - lvgl.widget.update: {id: msd_core_ha, bg_color: "${c_green}"}

  # v3.11: compose the header weather label from HA's temp + condition.
  # Condition strings arrive as HA slugs (partlycloudy, clear-night) -
  # normalized to spaced uppercase for the terminal look.
  - id: update_wx_line
    then:
      - lvgl.label.update:
          id: wx_icon
          text: !lambda |-
            std::string c = id(wx_state).state;
            if (c == "sunny") return "\U000F0599";
            if (c == "clear-night") return "\U000F0594";
            if (c == "partlycloudy") return "\U000F0595";
            if (c == "cloudy") return "\U000F0590";
            if (c == "rainy") return "\U000F0597";
            if (c == "pouring") return "\U000F0596";
            if (c == "lightning") return "\U000F0593";
            if (c == "lightning-rainy") return "\U000F067E";
            if (c == "snowy") return "\U000F0598";
            if (c == "snowy-rainy") return "\U000F067F";
            if (c == "fog") return "\U000F0591";
            if (c == "windy" || c == "windy-variant") return "\U000F059D";
            if (c == "hail") return "\U000F0592";
            return "\U000F0590";
      - lvgl.label.update:
          id: wx_line
          text: !lambda |-
            static std::string r;
            std::string cond = id(wx_state).state;
            for (auto &c : cond) { if (c=='-'||c=='_') c=' '; c = toupper(c); }
            if (cond.rfind("PARTLYCLOUDY",0)==0) cond = "PARTLY CLOUDY";
            char buf[40];
            if (!isnan(id(wx_temp).state)) {
              snprintf(buf, sizeof(buf), "%.0f°F %s", id(wx_temp).state, cond.c_str());
            } else {
              snprintf(buf, sizeof(buf), "%s", cond.c_str());
            }
            r = buf;
            return r.c_str();
  - id: go_home
    then:
      - lvgl.widget.update: {id: bar_v, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: bar_h, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: bar_corner_fill, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: band_frame, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: band_window, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: btn_mv, bg_color: "${c_home}"}
      - lvgl.widget.update: {id: view_frame, border_color: "${c_home}"}
      - lvgl.label.update: {id: status_msg, text: "MAIN VIEWER RESTORED"}
      - lvgl.label.update: {id: viewer_placeholder, text: ""}
      - lvgl.widget.hide: viewer_cam_widget
      - globals.set: {id: g_snap_time, value: '0'}
      - lvgl.widget.hide: age_ring
      - lvgl.widget.hide: age_text
      - lvgl.widget.hide: age_caption
      - script.execute: viewer_gauges_hide
      - script.execute: msd_show
      - globals.set: {id: g_view_home, value: 'true'}
  - id: enter_timeout
    then:
      # Todd-approved rec #2: MSD screensaver + backlight dim after 5 min idle
      - lambda: |-
          id(g_brt_saved) = id(backlight).current_values.get_brightness();
          id(g_dimmed) = true;
      - lvgl.widget.hide: viewer_cam_widget
      - globals.set: {id: g_snap_time, value: '0'}
      - lvgl.widget.hide: age_ring
      - lvgl.widget.hide: age_text
      - lvgl.widget.hide: age_caption
      - lvgl.label.update: {id: viewer_placeholder, text: ""}
      - script.execute: viewer_gauges_hide
      - script.execute: msd_show
      - light.turn_on:
          id: backlight
          brightness: 30%
      - lvgl.label.update: {id: status_msg, text: "STANDBY - MASTER SYSTEMS DISPLAY"}
  # v4.8 (Todd 2026-08-13): five minutes after the dim, everything except
  # the ship art hides. Backlight is NOT touched - he asked for the
  # schematic to stay "at the same dimness", so this is purely a
  # widget-visibility state, and any touch restores it.
  - id: enter_deep_idle
    then:
      - lambda: 'id(g_deep) = true;'
      - script.execute: msd_hide
      - lvgl.widget.show: msd_view
      - lvgl.widget.update: {id: view_frame, border_color: 0x000000}
      - lvgl.widget.hide: hdr_bar
      - lvgl.widget.hide: bar_v
      - lvgl.widget.hide: bar_h
      - lvgl.widget.hide: band_frame
      - lvgl.widget.hide: band_window
      - lvgl.widget.hide: bar_corner_fill
      - lvgl.widget.hide: status_msg
      - lvgl.widget.hide: btn_mv
      - lvgl.widget.hide: btn_ha_updates
      - lvgl.widget.hide: btn_notifications
      - lvgl.widget.hide: comms_btn
      - lvgl.widget.hide: btn_porch
      - lvgl.widget.hide: btn_bay
      - lvgl.widget.hide: tab_sensors
      - lvgl.widget.hide: tab_batt
      - lvgl.widget.hide: tab_updates
      - lvgl.widget.hide: tab_energy
      - lvgl.widget.hide: tab_devices
      - lvgl.widget.hide: tab_lights
  - id: leave_deep_idle
    then:
      - lambda: 'id(g_deep) = false;'
      - lvgl.widget.show: hdr_bar
      - lvgl.widget.show: bar_v
      - lvgl.widget.show: bar_h
      - lvgl.widget.show: band_frame
      - lvgl.widget.show: band_window
      - lvgl.widget.show: bar_corner_fill
      - lvgl.widget.show: status_msg
      - lvgl.widget.show: btn_mv
      - lvgl.widget.show: btn_ha_updates
      - lvgl.widget.show: btn_notifications
      - lvgl.widget.show: comms_btn
      - lvgl.widget.show: btn_porch
      - lvgl.widget.show: btn_bay
      - lvgl.widget.show: tab_sensors
      - lvgl.widget.show: tab_batt
      - lvgl.widget.show: tab_updates
      - lvgl.widget.show: tab_energy
      - lvgl.widget.show: tab_devices
      - lvgl.widget.show: tab_lights
      - lvgl.widget.hide: badge_ntf
      - lvgl.widget.update: {id: view_frame, border_color: "${c_home}"}
      - script.execute: msd_show
      - script.execute: fetch_summaries
  - id: wake_from_timeout
    then:
      - lambda: 'id(g_dimmed) = false;'
      - if:
          condition:
            lambda: 'return id(g_deep);'
          then:
            - script.execute: leave_deep_idle
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(g_brt_saved);'
      - lvgl.label.update: {id: status_msg, text: "ALL SYSTEMS ONLINE"}
  # v4.6: one call shows/hides the whole MSD status board
  - id: msd_show
    then:
      - lvgl.widget.show: msd_view
      - lvgl.widget.show: msd_title
      - lvgl.widget.show: msd_line_batt
      - lvgl.widget.show: msd_line_energy_a
      - lvgl.widget.show: msd_line_energy_b
      - lvgl.widget.show: msd_line_energy_c
      - lvgl.widget.show: msd_line_upd
      - lvgl.widget.show: msd_line_sens
      - lvgl.widget.show: msd_line_core
      - lvgl.widget.show: msd_line_ntf
      - lvgl.widget.show: msd_bar_batt
      - lvgl.widget.show: msd_v_batt
      - lvgl.widget.show: msd_bar_energy
      - lvgl.widget.show: msd_v_energy
      - lvgl.widget.show: msd_bar_upd
      - lvgl.widget.show: msd_v_upd
      - lvgl.widget.show: msd_bar_sens
      - lvgl.widget.show: msd_v_sens
      - lvgl.widget.show: msd_bar_core
      - lvgl.widget.show: msd_v_core
      - lvgl.widget.show: msd_bar_ntf
      - lvgl.widget.show: msd_v_ntf
      - lvgl.widget.show: msd_node_batt
      - lvgl.widget.show: msd_node_energy
      - lvgl.widget.show: msd_node_upd
      - lvgl.widget.show: msd_node_sens
      - lvgl.widget.show: msd_node_ha
  - id: msd_hide
    then:
      - lvgl.widget.hide: msd_view
      - lvgl.widget.hide: msd_title
      - lvgl.widget.hide: msd_line_batt
      - lvgl.widget.hide: msd_line_energy_a
      - lvgl.widget.hide: msd_line_energy_b
      - lvgl.widget.hide: msd_line_energy_c
      - lvgl.widget.hide: msd_line_upd
      - lvgl.widget.hide: msd_line_sens
      - lvgl.widget.hide: msd_line_core
      - lvgl.widget.hide: msd_line_ntf
      - lvgl.widget.hide: msd_bar_batt
      - lvgl.widget.hide: msd_v_batt
      - lvgl.widget.hide: msd_bar_energy
      - lvgl.widget.hide: msd_v_energy
      - lvgl.widget.hide: msd_bar_upd
      - lvgl.widget.hide: msd_v_upd
      - lvgl.widget.hide: msd_bar_sens
      - lvgl.widget.hide: msd_v_sens
      - lvgl.widget.hide: msd_bar_core
      - lvgl.widget.hide: msd_v_core
      - lvgl.widget.hide: msd_bar_ntf
      - lvgl.widget.hide: msd_v_ntf
      - lvgl.widget.hide: msd_node_batt
      - lvgl.widget.hide: msd_node_energy
      - lvgl.widget.hide: msd_node_upd
      - lvgl.widget.hide: msd_node_sens
      - lvgl.widget.hide: msd_node_ha
  # v5.6: one call hides every viewer gauge widget
  - id: viewer_gauges_hide
    then:
      - lvgl.widget.hide: nrg_arc
      - lvgl.widget.hide: nrg_val
      - lvgl.widget.hide: nrg_cap
      - lvgl.widget.hide: nrg_list
      - lvgl.widget.hide: env_arc_hot
      - lvgl.widget.hide: env_arc_cold
      - lvgl.widget.hide: env_val
      - lvgl.widget.hide: env_cap
      - lvgl.widget.hide: env_list
      - lvgl.widget.hide: nrg_row_0
      - lvgl.widget.hide: nrg_row_1
      - lvgl.widget.hide: nrg_row_2
      - lvgl.widget.hide: nrg_row_3
      - lvgl.widget.hide: nrg_row_4
  - id: viewer_reset_timer
    mode: restart
    then:
      - delay: 12s
      - lvgl.label.update: {id: viewer_placeholder, text: ""}
      - script.execute: viewer_gauges_hide
      - script.execute: msd_show
  - id: va_ui_watchdog
    mode: restart
    then:
      - delay: 25s
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
      - lvgl.widget.update: {id: comms_btn, bg_color: "${c_comms}"}
      - lvgl.label.update: {id: comms_state, text: "TAP TO SPEAK"}
      - lvgl.label.update: {id: status_msg, text: "INTERFACE ENGINE READY"}
  - id: slider_hide_timer
    mode: restart
    then:
      - delay: 10s
      - lvgl.widget.hide: slider_vol
      - lvgl.widget.hide: slider_brt
      - lvgl.label.update: {id: status_msg, text: "SYSTEM READY"}


lvgl:
  rotation: 90
  displays:
    - display1
  touchscreens:
    - touch1
  on_idle:
    - timeout: 120s
      then:
        - if:
            condition:
              lambda: 'return !id(g_view_home);'
            then:
              - lvgl.label.update: {id: status_msg, text: "VIEW IDLE - RETURNING TO MAIN VIEWER"}
    - timeout: 240s
      then:
        - if:
            condition:
              lambda: 'return !id(g_view_home);'
            then:
              - lvgl.label.update: {id: status_msg, text: "VIEW IDLE - RETURNING TO MAIN VIEWER"}
    - timeout: 300s
      then:
        - if:
            condition:
              lambda: 'return !id(g_view_home);'
            then:
              - script.execute: go_home
        - script.execute: enter_timeout
    # v4.8: +5 min -> schematic only, nothing else on the glass.
    - timeout: 600s
      then:
        - script.execute: enter_deep_idle
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      pad_all: 0
      widgets:

        # ================= HEADER (bigger per Todd 2026-08-10) =================
        - obj:
            id: hdr_bar
            x: 0
            y: 0
            width: 1280
            height: 60
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - label:
                  id: status_line
                  x: 68
                  y: 14
                  width: 272
                  text_align: CENTER
                  text_font: montserrat_bold_28
                  text_color: ${c_home}
                  text: "syncing"
              # v3.11 header regroup (Todd live, 2026-08-10): LEFT side =
              # human stuff (time, date, weather), RIGHT side = technical
              # (version, IP, SSID, icons). Date matches the clock's font and
              # color, no leading zeros. Weather is live from HA.
              - label:
                  id: date_line
                  x: 280
                  y: 14
                  width: 190
                  text_align: CENTER
                  text_font: montserrat_bold_28
                  text_color: ${c_home}
                  text: "--/--/----"
              - label:
                  id: wx_icon
                  x: 478
                  y: 16
                  text: ""
                  text_font: mdi_icons_20
                  text_color: ${c_home}
              - label:
                  id: wx_line
                  x: 506
                  y: 18
                  width: 274
                  text_align: LEFT
                  text_font: montserrat_bold_20
                  text_color: ${c_home}
                  text: "--"
              # v4.7 (Todd 2026-08-13 nitpick): the version / IP / SSID group
              # was dim grey-violet. Same size, same face, but now in the
              # header's own home blue like the clock, date and weather - he
              # wanted this group to read as part of the header, not as
              # afterthought text.
              - label:
                  id: hdr_version
                  x: 720
                  y: 20
                  width: 280
                  text_align: RIGHT
                  text_font: montserrat_bold_20
                  text_color: ${c_home}
                  text: "${config_name}"
              - label:
                  id: ip_line
                  x: 1014
                  y: 22
                  width: 70
                  text_align: CENTER
                  text_font: montserrat_bold_16
                  text_color: ${c_home}
                  text: "IP .39"
              - label:
                  id: ssid_line
                  x: 1092
                  y: 22
                  width: 64
                  text_align: CENTER
                  text_font: montserrat_bold_16
                  text_color: ${c_home}
                  text: "ALPHA"
              - label:
                  id: wifi_status_icon
                  x: 1166
                  y: 12
                  text: ""
                  text_font: montserrat_32
                  text_color: ${c_green}
              - label:
                  id: batt_icon
                  x: 1222
                  y: 12
                  text: ""
                  text_font: montserrat_32
                  text_color: ${c_green}
              - button:
                  id: gear_btn
                  x: 20
                  y: 6
                  width: 48
                  height: 48
                  radius: 12
                  bg_color: ${c_amber}
                  shadow_width: 8
                  shadow_offset_x: 2
                  shadow_offset_y: 3
                  shadow_color: 0x000000
                  shadow_opa: 60%
                  pressed:
                    shadow_width: 0
                    translate_x: 2
                    translate_y: 3
                  on_click:
                    - rtttl.play: "beep:d=32,o=6,b=250:c,e"
                    - lvgl.widget.show: slider_vol
                    - lvgl.widget.show: slider_brt
                    - script.execute: slider_hide_timer
                    - lvgl.label.update:
                        id: status_msg
                        text: "TOP = VOLUME - BOTTOM = BRIGHTNESS - RELEASE TO APPLY"
                  widgets:
                    - label:
                        align: CENTER
                        text: ""
                        text_font: montserrat_24
                        text_color: 0x000000

        # ================= CONTIGUOUS ELBOW BAR =================
        - obj:
            id: bar_v
            x: 20
            y: 70
            width: 82
            height: 646
            radius: 24
            bg_color: ${c_home}
            border_width: 0
            pad_all: 0
            scrollable: false
        - obj:
            id: bar_h
            x: 20
            y: 70
            width: 436
            height: 46
            radius: 20
            bg_color: ${c_home}
            border_width: 0
            pad_all: 0
            scrollable: false
        # v3.11: ticks re-centered so the HOME gap sits exactly over the
        # COMMUNICATIONS button (comms center x=845; gap 698..992, mid 845)
        - obj:
            id: band_frame
            x: 468
            y: 70
            width: 722
            height: 46
            radius: 23
            bg_color: ${c_home}
            border_width: 0
        - obj:
            id: band_window
            x: 478
            y: 77
            width: 702
            height: 32
            radius: 16
            # v4.6: boots in home color; recolors follow the active section
            bg_color: ${c_home}
            border_width: 0
        - obj:
            id: bar_corner_fill
            x: 102
            y: 116
            width: 36
            height: 36
            radius: 0
            bg_color: ${c_home}
            border_width: 0
        - obj:
            x: 102
            y: 116
            width: 72
            height: 72
            radius: 36
            bg_color: 0x000000
            border_width: 0
        # v3.20: the band window IS the status line now (Todd 2026-08-10) -
        # status_msg lives here, chip-sized like NOTIFICATIONS; the viewer
        # carries only clock + response text. Section identity = band color.
        - label:
            id: status_msg
            x: 494
            y: 82
            width: 670
            text_align: CENTER
            long_mode: SCROLL
            text: "ALL SYSTEMS ONLINE"
            # v5.4 (Todd): biggest face that fits the 32px band window.
            # long_mode SCROLL stays - long messages scroll horizontally.
            text_font: montserrat_bold_20
            text_color: 0x000000

        # v4.4 Stage B: snapshot-age ring at the right end of the band.
        # Native LVGL arc - rim sweeps 0-60s, then holds full and goes amber.
        # Black bezel keeps it readable on every section color.
        # v5.4 (Todd): snapshot-age timer lives in the black gap between
        # HA NOTIFICATIONS and CAM 1. No well - invisible until a
        # snapshot is on the viewer, then ring + digits light up.
        - arc:
            id: age_ring
            hidden: true
            x: 428
            y: 133
            width: 56
            height: 56
            min_value: 0
            max_value: 60
            value: 0
            arc_width: 6
            adjustable: false
            arc_color: 0x10231A
            indicator:
              arc_color: ${c_green}
              arc_width: 6
            knob:
              bg_opa: TRANSP
        - label:
            id: age_text
            hidden: true
            x: 486
            y: 146
            width: 62
            text_align: CENTER
            text: ""
            text_font: montserrat_bold_20
            text_color: ${c_green}
        - label:
            id: age_caption
            hidden: true
            x: 486
            y: 170
            width: 62
            text_align: CENTER
            text: "SNAP\nAGE"
            text_font: montserrat_bold_12
            text_color: ${c_dim}

        # ================= LEFT TAB STACK (7 two-row tabs) =================
        # v3.19: MAIN VIEWER band button REMOVED (Todd 2026-08-10) - the big MV
        # button on the elbow corner is THE viewer/home control now. Band runs
        # unbroken to the NOTIFICATIONS separator. Panel black separators
        # segment every element on the band.
        - button:
            id: btn_mv
            x: 20
            y: 70
            width: 120
            height: 130
            radius: 24
            bg_color: ${c_home}
            border_width: 4
            border_color: ${c_paper}
            pad_all: 0
            shadow_width: 8
            shadow_offset_x: 2
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            pressed:
              shadow_width: 0
              translate_x: 2
              translate_y: 3
            on_click:
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - script.execute: go_home
            widgets:
              - label:
                  x: 0
                  y: 12
                  width: 112
                  text_align: CENTER
                  text: "MV"
                  text_font: montserrat_bold_20
                  text_color: 0x000000
              - label:
                  x: 0
                  y: 46
                  width: 112
                  text_align: CENTER
                  text: "\U000F0502"
                  text_font: mdi_icons_48
                  text_color: 0x000000
        # v4.7 tab order (Todd 2026-08-13): CRITICAL SENSORS takes the top
        # slot - it is the only tab whose state can mean "something is wrong
        # right now", so it earns first read. DEVICE STATUS and UPDATES lost
        # their state dots entirely: Todd's call was that neither one changes
        # what the house is actually doing ("they really don't impact the
        # operation of the ship"), so a live alarm dot overstated them. Their
        # numbers still read live in the value line.
        - button:
            id: tab_batt
            x: 52
            y: 292
            width: 360
            height: 78
            radius: 31
            bg_color: ${c_batt}
            pad_all: 0
            shadow_width: 8
            shadow_offset_x: 2
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            pressed:
              shadow_width: 0
              translate_x: 2
              translate_y: 3
            on_click:
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - lvgl.widget.update: {id: bar_v, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: bar_h, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: bar_corner_fill, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: band_frame, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: band_window, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: btn_mv, bg_color: "${c_batt}"}
              - lvgl.widget.update: {id: view_frame, border_color: "${c_batt}"}
              - lvgl.label.update: {id: status_msg, text: "DISPLAYING DEVICE STATUS"}
              - script.execute: msd_hide
              - script.execute: viewer_gauges_hide
              - lvgl.widget.hide: viewer_cam_widget
              - lvgl.label.update:
                  id: viewer_placeholder
                  text: "DEVICE STATUS VIEW\nCHOOSE THE FLEET DETAILS\nTO EXPOSE HERE"
              - script.execute: viewer_reset_timer
              - globals.set: {id: g_view_home, value: 'false'}
            widgets:
              - label:
                  x: 24
                  y: 26
                  text: "\uF242"
                  text_font: montserrat_24
                  text_color: 0x000000
              - label:
                  x: 0
                  y: 10
                  width: 360
                  text_align: CENTER
                  long_mode: SCROLL
                  text: "DEVICE STATUS"
                  text_font: montserrat_bold_20
                  text_color: 0x000000
              - label:
                  id: v_batt
                  x: 0
                  y: 44
                  width: 360
                  text_align: CENTER
                  text: "--"
                  text_font: montserrat_bold_16
                  text_color: 0x000000
        - button:
            id: tab_updates
            x: 52
            y: 377
            width: 360
            height: 78
            radius: 31
            bg_color: ${t_updates}
            pad_all: 0
            shadow_width: 8
            shadow_offset_x: 2
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            pressed:
              shadow_width: 0
              translate_x: 2
              translate_y: 3
            on_click:
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - lvgl.widget.update: {id: bar_v, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: bar_h, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: bar_corner_fill, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: band_frame, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: band_window, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: btn_mv, bg_color: "${t_updates}"}
              - lvgl.widget.update: {id: view_frame, border_color: "${t_updates}"}
              - lvgl.label.update: {id: status_msg, text: "DISPLAYING UPDATES"}
              - script.execute: msd_hide
              - script.execute: viewer_gauges_hide
              - lvgl.widget.hide: viewer_cam_widget
              - lvgl.label.update:
                  id: viewer_placeholder
                  text: "UPDATES VIEW\nCHOOSE THE UPDATE DETAILS\nTO EXPOSE HERE"
              - script.execute: viewer_reset_timer
              - globals.set: {id: g_view_home, value: 'false'}
            widgets:
              - label:
                  x: 24
                  y: 26
                  text: "\uF019"
                  text_font: montserrat_24
                  text_color: 0x000000
              - label:
                  x: 0
                  y: 10
                  width: 360
                  text_align: CENTER
                  long_mode: SCROLL
                  text: "UPDATES"
                  text_font: montserrat_bold_20
                  text_color: 0x000000
              - label:
                  id: v_updates
                  x: 0
                  y: 44
                  width: 360
                  text_align: CENTER
                  text: "--"
                  text_font: montserrat_bold_16
                  text_color: 0x000000
        - button:
            id: tab_lights
            # v4.4 tab order (Todd 2026-08-13): the three tabs that carry a
            # state dot sit together at the top (DEVICE STATUS, UPDATES,
            # CRITICAL SENSORS), then ENERGY, DEVICES DISCOVERED, LIGHTS.
            x: 52
            y: 632
            width: 360
            height: 78
            radius: 31
            bg_color: ${c_lights}
            pad_all: 0
            shadow_width: 8
            shadow_offset_x: 2
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            pressed:
              shadow_width: 0
              translate_x: 2
              translate_y: 3
            on_click:
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - lvgl.widget.update: {id: bar_v, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: bar_h, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: bar_corner_fill, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: band_frame, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: band_window, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: btn_mv, bg_color: "${c_lights}"}
              - lvgl.widget.update: {id: view_frame, border_color: "${c_lights}"}
              - lvgl.label.update: {id: status_msg, text: "ENVIRONMENT - FETCHING"}
              - globals.set: {id: g_view_home, value: 'false'}
              # v5.6: dual-ring climate dial, native LVGL - outer ring =
              # warmest room, inner = coolest, room list beside. The gauge
              # widgets are hidden-until-used (the invisible-timer principle).
              - script.execute: msd_hide
              - script.execute: viewer_gauges_hide
              - lvgl.widget.hide: viewer_cam_widget
              - lvgl.label.update: {id: viewer_placeholder, text: ""}
              - http_request.post:
                  url: "http://${ha_host_ip}:8123/api/template"
                  request_headers:
                    Authorization: !secret ha_token_bearer
                    Content-Type: "application/json"
                  json:
                    template: "{% set t = ['sensor.family_room_broadlink_remote_temperature','sensor.master_echo_temperature_2','sensor.smartthings_motion_sensor_temperature','sensor.3rd_bay_bluecharm_bc021pro_temperature'] | map('states') | select('ne','unknown') | select('ne','unavailable') | map('float') | list %}{{ t | min | round(1) }}|{{ t | max | round(1) }}"
                  capture_response: true
                  max_response_buffer_size: 128
                  on_response:
                    - lambda: |-
                        float lo = 0, hi = 0;
                        if (sscanf(body.c_str(), "%f|%f", &lo, &hi) == 2) {
                          lv_arc_set_value(id(env_arc_cold), (int) lo);
                          lv_arc_set_value(id(env_arc_hot), (int) hi);
                          char b[32];
                          snprintf(b, sizeof(b), "%.0f\u00B0-%.0f\u00B0F", lo, hi);
                          lv_label_set_text(id(env_val), b);
                        }
              - http_request.post:
                  url: "http://${ha_host_ip}:8123/api/template"
                  request_headers:
                    Authorization: !secret ha_token_bearer
                    Content-Type: "application/json"
                  json:
                    template: "FAMILY RM - {{ states('sensor.family_room_broadlink_remote_temperature') | float(0) | round(1) }}\u00B0\nMASTER - {{ states('sensor.master_echo_temperature_2') | float(0) | round(1) }}\u00B0\nMOTION - {{ states('sensor.smartthings_motion_sensor_temperature') | float(0) | round(1) }}\u00B0\n3RD BAY - {{ states('sensor.3rd_bay_bluecharm_bc021pro_temperature') | float(0) | round(1) }}\u00B0"
                  capture_response: true
                  max_response_buffer_size: 512
                  on_response:
                    - lvgl.label.update:
                        id: env_list
                        text: !lambda 'static std::string r; r = body; return r.c_str();'
                    - lvgl.widget.show: env_arc_hot
                    - lvgl.widget.show: env_arc_cold
                    - lvgl.widget.show: env_val
                    - lvgl.widget.show: env_cap
                    - lvgl.widget.show: env_list
                    - lvgl.label.update: {id: status_msg, text: "INDOOR ENVIRONMENT - MAIN VIEWER"}
                    - script.execute: viewer_reset_timer
            widgets:
              - label:
                  x: 24
                  y: 26
                  text: "\U000F050F"
                  text_font: mdi_icons_26
                  text_color: 0x000000
              - label:
                  x: 0
                  y: 10
                  width: 360
                  text_align: CENTER
                  long_mode: SCROLL
                  text: "ENVIRONMENT"
                  text_font: montserrat_bold_20
                  text_color: 0x000000
              - label:
                  id: v_lights
                  x: 0
                  y: 44
                  width: 360
                  text_align: CENTER
                  text: "--"
                  text_font: montserrat_bold_16
                  text_color: 0x000000
        - button:
            id: tab_devices
            x: 52
            y: 547
            width: 360
            height: 78
            radius: 31
            bg_color: ${c_devices}
            pad_all: 0
            shadow_width: 8
            shadow_offset_x: 2
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            pressed:
              shadow_width: 0
              translate_x: 2
              translate_y: 3
            on_click:
              - rtttl.play: "beep:d=32,o=6,b=250:c,e"
              - lvgl.widget.update: {id: bar_v, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: bar_h, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: bar_corner_fill, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: band_frame, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: band_window, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: btn_mv, bg_color: "${c_devices}"}
              - lvgl.widget.update: {id: view_frame, border_color: "${c_devices}"}
              - lvgl.label.update: {id: status_msg, text: "FRIGATE NVR - * MARKS DATA THAT ARRIVES WITH THE HA DASHBOARD STAGE"}
              - script.execute: msd_hide
              - script.execute: viewer_gauges_hide
              - lvgl.widget.hide: viewer_cam_widget
              - lvgl.label.update:
                  id: viewer_placeholder
                  text: "FRIGATE VIEW\nCHOOSE THE NVR DETAILS\nTO EXPOSE HERE *"
              - script.execute: viewer_reset_timer
              - globals.set: {id: g_view_home, value: 'false'}
            widgets:
              - label:
                  x: 24
